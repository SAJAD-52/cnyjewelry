<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anniversary gift by year | koojewelry</title><meta name="description" content="Traditional gifts and gemstones for every wedding anniversary, with a jewelry idea for each year."><meta name="theme-color" content="#020617"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💍%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="style.css"></head><body><a class="skip" href="#main">Skip to content</a><div id="nav"></div><main id="main" class="mx-auto max-w-6xl px-5 pb-24 pt-10"><div class="max-w-2xl mb-10"><h1 class="text-5xl md:text-6xl gt">Anniversary gifts by year</h1><p class="muted text-lg mt-4">Slide to your anniversary for the traditional gift, the gemstone, and a jewelry idea.</p></div><div class="grid lg:grid-cols-5 gap-6"><div class="glass p-6 lg:col-span-2"><label for="yr" class="block mb-3">Years together: <b id="yv" class="serif text-3xl gt"></b></label><input id="yr" type="range" min="1" max="60" value="1"><p class="muted text-sm mt-6 mb-2">Milestone years</p><div id="ms" class="flex flex-wrap gap-2"></div></div><div id="out" class="glass p-6 lg:col-span-3"></div></div>
<div class="glass p-6 mt-6"><p class="muted">Traditions differ by country, and several years have more than one theme. Treat these as inspiration, not rules.</p></div><div data-ad="banner"></div></main><div id="foot"></div><script src="layout.js"></script><script src="ads.js"></script><script>var T={1:'Paper',2:'Cotton',3:'Leather',4:'Linen or silk',5:'Wood',6:'Iron',7:'Wool or copper',8:'Bronze',9:'Pottery',10:'Tin or aluminum',11:'Steel',12:'Silk or linen',13:'Lace',14:'Ivory (often replaced today by mother-of-pearl)',15:'Crystal',20:'China',25:'Silver',30:'Pearl',35:'Coral',40:'Ruby',45:'Sapphire',50:'Gold',55:'Emerald',60:'Diamond'};
var G={1:'Gold',2:'Garnet',3:'Pearl',4:'Blue topaz',5:'Sapphire',6:'Amethyst',7:'Onyx',8:'Tourmaline',9:'Lapis lazuli',10:'Diamond',11:'Turquoise',12:'Jade',13:'Citrine',14:'Opal',15:'Ruby',16:'Peridot',18:"Cat's eye",19:'Aquamarine',20:'Emerald',25:'Silver',30:'Pearl',35:'Jade',40:'Ruby',45:'Sapphire',50:'Gold',55:'Emerald',60:'Diamond'};
var MS=[1,5,10,15,20,25,30,40,50,60],yr=document.getElementById('yr');
function nxt(n){for(var i=0;i<MS.length;i++)if(MS[i]>n)return MS[i];return 60}
function upd(){var n=+yr.value,g=G[n],t=T[n];document.getElementById('yv').textContent=n;
document.getElementById('ms').innerHTML=MS.map(function(m){return '<button class="chip" style="padding:.3rem .8rem" aria-pressed="'+(m===n)+'" data-m="'+m+'">'+m+'</button>'}).join('');
document.querySelectorAll('#ms button').forEach(function(b){b.onclick=function(){yr.value=b.dataset.m;upd()}});
var idea=g?((g==='Gold'||g==='Silver')?'A classic '+g.toLowerCase()+' chain, bracelet or band.':'A pendant, ring or earrings set with '+g.toLowerCase()+'.'):'No official theme for this year. Pair a small piece with a note, or plan ahead for year '+nxt(n)+'.';
document.getElementById('out').innerHTML='<div class="fade"><h2 class="text-4xl gt">Year '+n+'</h2><div class="grid sm:grid-cols-2 gap-3 mt-5"><div class="stat"><span class="muted text-sm">Traditional gift</span><b class="gt" style="font-size:1.5rem">'+(t||'None')+'</b></div><div class="stat"><span class="muted text-sm">Gemstone</span><b class="gt" style="font-size:1.5rem">'+(g||'None')+'</b></div></div><p class="mt-5"><b class="serif text-xl">Jewelry idea</b><br><span class="muted">'+idea+'</span></p><div class="mt-4">'+(g?KOO.btn('anniv-'+n,'Year '+n+': '+g+' jewelry','Anniversary'):'')+'</div></div>';KOO.sync()}
yr.oninput=upd;upd();</script></body></html>
