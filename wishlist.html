<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist | McGee Jewelry</title><meta name="description" content="Your saved jewelry ideas, stored on this device only."><meta name="theme-color" content="#020617"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="canonical" href="https://mcgeejewelry.com/wishlist"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="style.css"></head><body><a class="skip" href="#main">Skip to content</a><div id="nav"></div><main id="main" class="mx-auto max-w-6xl px-5 pb-24 pt-10"><div class="max-w-2xl mb-10"><h1 class="text-5xl md:text-6xl gt">Your wishlist</h1><p class="muted text-lg mt-4">Saved on this device only. Clearing your browser data removes it.</p></div><div id="wl"></div></main><div id="foot"></div><script src="layout.js"></script><script>function render(){var a=KOO.get(),el=document.getElementById('wl');
if(!a.length){el.innerHTML='<div class="glass p-10 text-center max-w-xl"><h2 class="text-3xl gt">Nothing saved yet</h2><p class="muted mt-2">Tap Save on any recommendation and it will appear here.</p><div class="flex flex-wrap justify-center gap-3 mt-6"><a class="btn btn-gold" href="/gift">Find a gift</a><a class="btn btn-ghost" href="/styling">Match your metal</a></div></div>';return}
el.innerHTML='<div class="flex flex-wrap gap-3 mb-6"><button id="cp" class="btn btn-gold">Copy list</button><button id="cl" class="btn btn-ghost">Clear all</button><span id="ms" class="muted self-center" aria-live="polite"></span></div><ul class="grid md:grid-cols-2 gap-4">'+a.map(function(x){return '<li class="glass p-5 flex items-center justify-between gap-4"><div><h3 class="text-2xl">'+x.label+'</h3><p class="muted text-sm">'+(x.note||'')+'</p></div><button class="btn btn-ghost" style="padding:.35rem 1rem" data-rm="'+x.id+'">Remove</button></li>'}).join('')+'</ul>';
el.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){KOO.set(KOO.get().filter(function(x){return x.id!==b.dataset.rm}));KOO.sync();render()}});
document.getElementById('cl').onclick=function(){if(confirm('Remove all saved items?')){KOO.set([]);KOO.sync();render()}};
document.getElementById('cp').onclick=function(){var t=KOO.get().map(function(x){return '- '+x.label}).join('\n');var m=document.getElementById('ms');
(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){m.textContent='Copied.'},function(){m.textContent='Copy is not available in this browser.'})}}
render();</script></body></html>
