<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist | McGee Jewelry</title><meta name="description" content="Your saved jewelry ideas, synced securely across devices."><meta name="theme-color" content="#020617"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="canonical" href="https://mcgeejewelry.com/wishlist"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="style.css"></head><body><a class="skip" href="#main">Skip to content</a><div id="nav"></div><main id="main" class="mx-auto max-w-6xl px-5 pb-24 pt-10"><div class="max-w-2xl mb-10"><h1 class="text-5xl md:text-6xl gt">Your Wishlist</h1><p class="muted text-lg mt-4">Saved jewelry ideas and recommendations. When logged in, your wishlist syncs securely to your cloud account.</p></div><div id="wl"></div></main><div id="foot"></div><script src="layout.js"></script><script>
function render(){
  var a = KOO.get(), el = document.getElementById('wl');
  if(!a.length){
    el.innerHTML = '<div class="glass p-10 text-center max-w-xl"><h2 class="text-3xl gt">Nothing saved yet</h2><p class="muted mt-2">Tap Save on any recommendation or piece and it will appear here.</p><div class="flex flex-wrap justify-center gap-3 mt-6"><a class="btn btn-gold" href="gift.html">Find a gift</a><a class="btn btn-ghost" href="styling.html">Match your metal</a></div></div>';
    return;
  }
  el.innerHTML = '<div class="flex flex-wrap gap-3 mb-6"><button id="cp" class="btn btn-gold">Copy list</button><button id="cp-partner" class="btn btn-ghost">💌 Copy Size + Gift Card</button><button id="cl" class="btn btn-ghost">Clear all</button><span id="ms" class="muted self-center" aria-live="polite"></span></div><ul class="grid md:grid-cols-2 gap-4">' +
    a.map(function(x){
      return '<li class="glass p-5 flex items-center justify-between gap-4"><div><h3 class="text-2xl gt">' + x.label + '</h3><p class="muted text-sm mt-0.5">' + (x.note || 'Saved piece') + '</p></div><button class="btn btn-ghost text-xs" style="padding:.35rem 1rem" data-rm="' + x.id + '">Remove</button></li>';
    }).join('') + '</ul>';

  el.querySelectorAll('[data-rm]').forEach(function(b){
    b.onclick = function(){
      var id = b.dataset.rm;
      var cur = KOO.get().filter(function(x){ return x.id !== id; });
      KOO.set(cur);
      if (window.currentUser && window.sb) {
        window.sb.from('wishlist').delete().eq('user_id', window.currentUser.id).filter('item->>id', 'eq', id).then(function(){});
      }
      KOO.sync();
      render();
    };
  });

  var btnClear = document.getElementById('cl');
  if(btnClear){
    btnClear.onclick = function(){
      if(confirm('Remove all saved items from your wishlist?')){
        KOO.set([]);
        if (window.currentUser && window.sb) {
          window.sb.from('wishlist').delete().eq('user_id', window.currentUser.id).then(function(){});
        }
        KOO.sync();
        render();
      }
    };
  }

  var btnCopy = document.getElementById('cp');
  if(btnCopy){
    btnCopy.onclick = function(){
      var t = KOO.get().map(function(x){ return '- ' + x.label + (x.note ? ' (' + x.note + ')' : ''); }).join('\n');
      var m = document.getElementById('ms');
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){
        m.textContent = 'Copied to clipboard!';
        setTimeout(function(){ m.textContent = ''; }, 2500);
      }, function(){
        m.textContent = 'Copy unavailable on this browser.';
      });
    };
  }

  var btnPartner = document.getElementById('cp-partner');
  if(btnPartner){
    btnPartner.onclick = function(){
      var pp = {};
      try { pp = JSON.parse(localStorage.getItem('mcgee_passport') || '{}'); } catch(e){}
      var lines = ['✨ My McGee Jewelry Size & Gift Card'];
      if (pp.ring_size_us) lines.push('• Ring Size: US ' + pp.ring_size_us);
      if (pp.wrist_cm) lines.push('• Bracelet Fit: ' + (parseFloat(pp.wrist_cm) + 2).toFixed(1) + ' cm comfort');
      if (pp.preferred_metal) lines.push('• Favorite Metal: ' + pp.preferred_metal);
      lines.push('');
      lines.push('♡ Wishlist Picks:');
      KOO.get().forEach(function(x){ lines.push('- ' + x.label + (x.note ? ' (' + x.note + ')' : '')); });
      var m = document.getElementById('ms');
      (navigator.clipboard ? navigator.clipboard.writeText(lines.join('\n')) : Promise.reject()).then(function(){
        m.textContent = '💌 Copied Size + Gift Card for your partner!';
        setTimeout(function(){ m.textContent = ''; }, 3000);
      }, function(){
        m.textContent = 'Copy unavailable on this browser.';
      });
    };
  }
}
render();
window.addEventListener('mcgee:auth-ready', function(){
  if (window.KOO && window.KOO.loadFromCloud) {
    window.KOO.loadFromCloud().then(render);
  } else {
    render();
  }
});
if (window.__mcgeeAuthReady && window.KOO && window.KOO.loadFromCloud) {
  window.KOO.loadFromCloud().then(render);
}
</script></body></html>
