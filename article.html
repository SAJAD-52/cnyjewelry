<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Article | McGee Jewelry</title>
  <meta name="theme-color" content="#fbf5f2">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#fbf5f2] text-[#3b2a2e] font-sans min-h-screen flex flex-col">
  <div id="nav"></div>
  <main id="main" class="mx-auto max-w-4xl px-5 pb-24 pt-10 flex-1 w-full">
    <div id="article-content">
      <div class="glass p-12 rounded-3xl text-center">
        <h1 class="serif text-3xl gt">Loading article...</h1>
      </div>
    </div>
  </main>
  <div id="foot"></div>

  <script src="layout.js"></script>
  <script src="ads.js"></script>
  <script src="affiliates.js"></script>
  <script src="showcase.js"></script>
  <script>
    function inline(s){s=String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(m,t,u){return '<a href="'+u+'">'+t+'</a>'});s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');return s.replace(/(^|[^*])\*(?!\s)(.+?)(?<!\s)\*(?!\*)/g,'$1<i>$2</i>')}
    var LI=/^(-|\*|\d+\.)\s+/;
    function md(body){var L=body.replace(/^\n+|\n+$/g,'').split('\n'),i=0,out=[];
    while(i<L.length){var l=L[i];
    if(!l.trim()){i++;continue}
    if(/^---+\s*$/.test(l)){out.push('<hr class="my-8 border-rose-200/30">');i++;continue}
    if(l.indexOf(':::note')===0){var b=[];i++;while(i<L.length&&L[i].indexOf(':::')!==0){b.push(L[i]);i++}i++;out.push('<p class="note">'+inline(b.join(' '))+'</p>');continue}
    if(l.indexOf('### ')===0){out.push('<h3 class="serif text-2xl gt mt-6 mb-2">'+inline(l.slice(4))+'</h3>');i++;continue}
    if(l.charAt(0)==='|'){var rows=[];while(i<L.length&&L[i].charAt(0)==='|'){rows.push(L[i]);i++}
    var cells=rows.filter(function(r){return !/^\|[\s:|-]+\|?$/.test(r)}).map(function(r){return r.trim().replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim()})});
    if(cells.length){out.push('<div class="overflow-x-auto my-4"><table><thead><tr>'+cells[0].map(function(c){return '<th>'+inline(c)+'</th>'}).join('')+'</tr></thead><tbody>'+cells.slice(1).map(function(r){return '<tr>'+r.map(function(c){return '<td>'+inline(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>')}continue}
    if(LI.test(l)){var ord=/^\d/.test(l),it=[];while(i<L.length&&LI.test(L[i])){it.push(L[i].replace(LI,''));i++}var t=ord?'ol':'ul';out.push('<'+t+'>'+it.map(function(x){return '<li>'+inline(x)+'</li>'}).join('')+'</'+t+'>');continue}
    var p=[];while(i<L.length&&L[i].trim()&&!/^(#{2,3} |\||:::|(-|\*|\d+\.)\s+)/.test(L[i])){p.push(L[i]);i++}
    if(!p.length){p.push(L[i]);i++}
    out.push('<p class="mt-4 leading-relaxed">'+inline(p.join(' '))+'</p>')}
    return out.join('')}

    function parse(t){t=String(t||'').replace(/\r\n/g,'\n');var m=t.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/),fm={},body=t;
    if(m){m[1].split('\n').forEach(function(l){var i=l.indexOf(':');if(i>0&&l.charAt(0)!=='#')fm[l.slice(0,i).trim().toLowerCase()]=l.slice(i+1).trim().replace(/^"|"$/g,'')});body=m[2]}
    var parts=body.split(/^## (.+)$/m),secs=[],faq=[];
    for(var j=1;j<parts.length;j+=2){var h=parts[j].trim(),b=parts[j+1]||'';
    if(/faq|frequently/i.test(h)){
      var items=b.split(/^### /m).slice(1);
      if(items.length>0){items.forEach(function(q){var k=q.indexOf('\n');faq.push([q.slice(0,k<0?q.length:k).trim(),k<0?'':q.slice(k+1).trim()])})}
      else {b.split(/\n\n+/).forEach(function(chunk){var lines=chunk.split('\n').filter(Boolean);if(lines.length>=2){faq.push([lines[0].replace(/^[-*#\d.]+\s*/,'').trim(),lines.slice(1).join(' ')])}})}
    }else secs.push([h,b])}
    return {fm:fm,body:body.trim(),secs:secs,faq:faq}}

    (async function(){
      var params = new URLSearchParams(window.location.search);
      var slug = params.get('slug');
      if (!slug) {
        var pathSegments = window.location.pathname.split('/').filter(Boolean);
        if (pathSegments.length > 0 && pathSegments[0] !== 'article.html') {
          slug = pathSegments[pathSegments.length - 1];
        }
      }

      if (!slug) {
        document.getElementById('article-content').innerHTML = '<div class="glass p-12 rounded-3xl text-center"><h1 class="serif text-3xl gt">Article not specified</h1><p class="muted mt-3"><a href="blog.html" class="underline">Return to blog</a></p></div>';
        return;
      }

      // Check localStorage for articles
      var localArticles = [];
      try {
        localArticles = JSON.parse(localStorage.getItem('md_articles') || '[]');
      } catch(e) {}

      var found = localArticles.find(function(a){ return a.slug === slug || '/'+a.slug === slug; });
      if (found) {
        renderArticle(slug, found);
        return;
      }

      // Check blog-data.json
      try {
        var res = await fetch('blog-data.json');
        var data = await res.json();
        var meta = data.find(function(x){ return x.url === '/'+slug || x.url === slug || x.url === '/article.html?slug='+slug; });
        if (meta) {
          renderArticle(slug, {
            title: meta.title,
            category: meta.cat,
            description: meta.blurb,
            lead: meta.blurb,
            customUrl: meta.customUrl || '',
            body: '## Overview\n' + meta.blurb + '\n\n## Expert Care & Styling\nFine jewelry requires careful attention to detail. Whether you are maintaining solid gold or measuring precise sizing, our expert studios provide the exact guidance you need.\n\n## FAQ\n### Are these guides free to use?\nYes, all McGee Jewelry guides and interactive studio tools are completely free to explore.\n### How often should I check my jewelry?\nWe recommend inspecting your prongs, clasps, and settings every six months.'
          });
          return;
        }
      } catch(e) {}

      renderArticle(slug, {
        title: slug.replace(/-/g, ' ').replace(/\b\w/g, function(l){ return l.toUpperCase(); }),
        category: 'Guides',
        description: 'Comprehensive fine jewelry guide by McGee Jewelry.',
        lead: 'Expert advice, sizing, care, and styling tips.',
        body: '## Overview\nExplore our expert guide on fine jewelry. Use our interactive studio tools to calculate gold melt value, measure ring sizes, and curate your daily lookbook.\n\n## FAQ\n### Is this guide free?\nYes, all McGee guides are free.'
      });
    })();

    async function renderArticle(slug, a) {
      document.title = (a.title || 'Article') + ' | McGee Jewelry';
      var p = parse(a.body || '');
      var bodyHtml = p.secs.map(function(s){
        return '<div class="pk mx-auto max-w-3xl my-8"><h2 class="serif text-2xl md:text-3xl gt mb-4">'+s[0]+'</h2>'+md(s[1])+'</div>';
      }).join('');

      var faqHtml = p.faq.length ? '<div class="pk mx-auto max-w-3xl my-8"><h2 class="serif text-2xl md:text-3xl gt mb-4">Frequently asked questions</h2><div class="grid gap-3">'+p.faq.map(function(q){
        return '<details class="faq glass p-4 rounded-xl"><summary class="font-medium cursor-pointer">'+q[0]+'</summary><div class="muted mt-2">'+md(q[1])+'</div></details>';
      }).join('')+'</div></div>' : '';

      var imgSrc = a.img;
      if (!imgSrc) {
        var candidate = 'images/' + slug + '/' + slug + '-16x9.webp';
        try {
          var testRes = await fetch(candidate, { method: 'HEAD' });
          if (testRes.ok) imgSrc = candidate;
        } catch(e){}
      }

      var heroHtml = imgSrc ? '<div class="mt-8 overflow-hidden rounded-2xl shadow-xl"><img src="'+imgSrc+'" alt="'+(a.imgAlt||a.title)+'" class="w-full object-cover"></div>' : '<div class="glass p-8 mt-8 rounded-2xl text-center" style="color:#b76e79"><svg viewBox="0 0 400 160" class="w-full max-w-md mx-auto" role="img" aria-label="Fine jewelry illustration"><defs><linearGradient id="gh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e2b3"/><stop offset=".5" stop-color="#e8b4b8"/><stop offset="1" stop-color="#b76e79"/></linearGradient></defs><circle cx="200" cy="80" r="50" fill="none" stroke="url(#gh)" stroke-width="12"/><polygon points="180,40 220,40 232,58 200,88 168,58" fill="#fff" stroke="#b76e79" stroke-width="1.5"/></svg></div>';

      var ctaHtml = a.customUrl ? '<div class="my-8 text-center"><a href="'+a.customUrl+'" target="_blank" class="btn btn-gold text-base py-3.5 px-8 inline-flex items-center gap-2 shadow-lg"><span>Visit Associated Link &rarr;</span></a></div>' : '';

      document.getElementById('article-content').innerHTML = `
        <article class="max-w-3xl mx-auto">
          <header class="mb-10 text-center">
            <p class="muted text-sm"><a href="blog.html" class="underline">Blog</a> &rsaquo; ${a.category || 'Guides'}</p>
            <h1 class="text-4xl md:text-6xl gt mt-3">${a.title}</h1>
            <p class="muted text-xl mt-4 leading-relaxed">${a.lead || a.description || ''}</p>
            <p class="muted text-xs mt-4">By McGee Jewelry &middot; Updated recently</p>
            ${heroHtml}
          </header>
          <div class="glass p-6 md:p-10 rounded-3xl">
            ${ctaHtml}
            ${bodyHtml}
            ${faqHtml}
            ${ctaHtml}
          </div>
          <div class="mt-10 text-center">
            <a href="blog.html" class="btn btn-gold">&larr; Back to Blog Guide Library</a>
          </div>
        </article>
      `;
    }
  </script>
</body>
</html>
