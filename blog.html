<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blog: jewelry guides and style advice | McGee Jewelry</title>
  <meta name="description" content="Guides from McGee Jewelry on chains, rings, earrings, plating, seasonal style and gifts.">
  <meta name="theme-color" content="#fbf5f2">
  <link rel="canonical" href="https://mcgeejewelry.com/blog">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#fbf5f2] text-[#3b2a2e] font-sans min-h-screen flex flex-col">
  <a class="skip" href="#main">Skip to content</a>
  <div id="nav"></div>
  <main id="main" class="mx-auto max-w-6xl px-5 pb-24 pt-10 flex-1 w-full">
    <div class="max-w-2xl mb-10">
      <h1 class="text-5xl md:text-6xl gt">The McGee Jewelry blog</h1>
      <p class="muted text-lg mt-4">Practical guides on chains, rings, earrings, plating, seasonal style and gifts.</p>
    </div>
    <div id="bf" class="flex flex-wrap gap-2 mb-8" role="tablist" aria-label="Blog categories"></div>
    <div id="bg" class="grid md:grid-cols-2 gap-5">
      <div class="glass p-8 rounded-2xl text-center md:col-span-2">
        <p class="muted">Loading guides...</p>
      </div>
    </div>
    <div data-showcase data-title="Try the tools behind the guides" data-sub="Every article links to free tools. Open one now." data-pick="sizing,care,styling"></div>
    <div data-ad="banner"></div>
  </main>
  <div id="foot"></div>

  <script src="layout.js"></script>
  <script src="ads.js"></script>
  <script src="showcase.js"></script>
  <script>
    async function loadBlog() {
      try {
        var res = await fetch('blog-data.json?' + Date.now());
        var data = await res.json();
        var P = data.map(function(r) {
          var u = r.url;
          if (!u.startsWith('/article.html') && !u.startsWith('/shop/') && !u.startsWith('/product-category/')) {
            var slug = u.replace(/^\//, '');
            u = '/article.html?slug=' + slug;
          }
          return [r.cat || 'Guides', r.title, r.blurb || r.short || '', r.read || '5 min read', u, r.grad || 'linear-gradient(135deg,#f3e2b3,#e8b4b8 55%,#b76e79)'];
        });

        // Also merge local storage articles if any
        try {
          var local = JSON.parse(localStorage.getItem('md_articles') || '[]');
          local.forEach(function(a){
            if (a.status === 'published') {
              var u = '/article.html?slug=' + a.slug;
              if (!P.some(function(p){ return p[4] === u; })) {
                P.unshift([a.category || 'Guides', a.title, a.description || '', '5 min read', u, 'linear-gradient(135deg,#f3e2b3,#e8b4b8 55%,#b76e79)']);
              }
            }
          });
        } catch(e){}

        var catSet = [];
        P.forEach(function(p){ if(catSet.indexOf(p[0]) < 0) catSet.push(p[0]); });
        var CT = [['all', 'All posts']].concat(catSet.map(function(c){ return [c, c]; }));
        var cur = 'all';

        function draw(){
          document.getElementById('bf').innerHTML = CT.map(function(c){
            return '<button class="chip" style="padding:.35rem .95rem" role="tab" aria-selected="'+(c[0]===cur)+'" data-c="'+c[0]+'">'+c[1]+'</button>';
          }).join('');
          var l = P.filter(function(p){ return cur==='all' || p[0]===cur; });
          document.getElementById('bg').innerHTML = l.map(function(p, i){
            var big = i === 0 && cur === 'all';
            return '<a href="'+p[4]+'" class="glass glow block no-underline text-inherit fade'+(big?' md:col-span-2':'')+'" style="padding:0"><div style="height:'+(big?'11rem':'7.5rem')+';background:'+p[5]+';display:flex;align-items:flex-end;padding:1rem"><span class="chip" style="padding:.2rem .8rem;font-size:.8rem;background:rgba(255,255,255,.85);color:#3b1a22;border-color:transparent">'+p[0]+'</span></div><div style="padding:1.5rem"><h2 class="serif" style="font-size:'+(big?'2.4rem':'1.9rem')+'">'+p[1]+'</h2><p class="muted mt-2">'+p[2]+'</p><p class="mt-4 text-sm"><span class="muted">'+p[3]+'</span> &nbsp; <b class="gt">Read the guide &rarr;</b></p></div></a>';
          }).join('');
          document.querySelectorAll('#bf [data-c]').forEach(function(b){
            b.onclick = function(){ cur = b.dataset.c; draw(); };
          });
        }
        draw();
      } catch(e) {
        document.getElementById('bg').innerHTML = '<div class="glass p-8 rounded-2xl text-center md:col-span-2"><p class="muted">Unable to load blog posts. Please check your connection.</p></div>';
      }
    }
    loadBlog();
  </script>
</body>
</html>
