<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewelry care guide | koojewelry</title><meta name="description" content="Material-by-material jewelry care: gold, silver, platinum, pearls, diamonds, gemstones and plated pieces."><meta name="theme-color" content="#020617"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💍%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="style.css"></head><body><a class="skip" href="#main">Skip to content</a><div id="nav"></div><main id="main" class="mx-auto max-w-6xl px-5 pb-24 pt-10"><div class="max-w-2xl mb-10"><h1 class="text-5xl md:text-6xl gt">Care for every material</h1><p class="muted text-lg mt-4">Choose a material for cleaning steps, storage and what to avoid.</p></div><div class="glass p-6"><div id="tabs" role="tablist" class="flex flex-wrap gap-2 mb-6" aria-label="Material"></div><div id="panel" role="tabpanel"></div></div></main><div id="foot"></div><script src="layout.js"></script><script>var C={
'Gold':{t:'Soft metal. It scratches before it tarnishes.',c:'#f3e2b3',clean:'Soak 15 minutes in warm water with mild dish soap. Brush gently with a soft toothbrush, rinse, pat dry.',avoid:'Chlorine pools and bleach. They can weaken alloys over time.',store:'Separate soft pouch, so pieces do not scratch each other.',freq:'Monthly for daily wear.'},
'Silver':{t:'Tarnishes with air and moisture, so wear it often.',c:'#cbd5e1',clean:'Use a silver polishing cloth. For heavy tarnish, a paste of baking soda and water, rubbed lightly.',avoid:'Rubber bands, wool, and perfume. They speed up tarnish.',store:'Airtight bag with an anti-tarnish strip.',freq:'Wipe after each wear. Polish every 1 to 2 months.'},
'Platinum':{t:'Dense and durable. It gains a soft patina.',c:'#e2e8f0',clean:'Warm soapy water and a soft brush. A jeweler can restore the mirror shine.',avoid:'Hard knocks against stones that are harder than the setting, and harsh chemicals.',store:'Own compartment, since platinum can scratch softer metals.',freq:'Monthly. Professional polish every year or two.'},
'Pearls':{t:'Organic and delicate. They are damaged by acids and dryness.',c:'#f8e8ee',clean:'Wipe with a soft damp cloth after wearing. Never soak or use an ultrasonic cleaner.',avoid:'Perfume, hairspray, vinegar, and any soaking.',store:'Flat, in soft fabric. Restring silk strands every 1 to 2 years.',freq:'Wipe after every wear.'},
'Diamonds':{t:'The hardest gem, but it attracts oil and lotion.',c:'#dbeafe',clean:'Soak 20 minutes in warm soapy water, brush behind the stone, rinse, dry with a lint-free cloth.',avoid:'Touching the stone, and chlorine on the setting.',store:'Separate from other diamonds, since they scratch each other.',freq:'Every 2 weeks. Have prongs checked yearly.'},
'Colored gems':{t:'Hardness varies by stone. Check yours.',c:'#e8b4b8',clean:'Warm soapy water and a soft brush. Skip steam and ultrasonic cleaners on emeralds, opals, and treated stones.',avoid:'Heat, sudden temperature changes, and strong cleaners.',store:'Padded box with a divider. Keep opals away from dry heat.',freq:'Every 2 to 4 weeks.'},
'Plated and costume':{t:'A thin coating over base metal. Treat it gently.',c:'#b76e79',clean:'Wipe with a dry soft cloth. Avoid soaking, and never use polish.',avoid:'Water, sweat, lotion, and showering. They wear the plating.',store:'Dry and airtight, with a silica packet.',freq:'Wipe after each wear.'}};
var keys=Object.keys(C),cur=keys[0];
function show(k){cur=k;var m=C[k];
document.getElementById('tabs').innerHTML=keys.map(function(x){return '<button class="chip" role="tab" aria-selected="'+(x===k)+'" data-k="'+x+'">'+x+'</button>'}).join('');
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){show(b.dataset.k)}});
var rows=[['Clean',m.clean],['Avoid',m.avoid],['Store',m.store],['How often',m.freq]];
document.getElementById('panel').innerHTML='<div class="fade"><div class="flex items-center gap-4"><span class="w-12 h-12 rounded-full" style="background:radial-gradient(circle at 30% 30%,#fff,'+m.c+' 60%,#334155);box-shadow:0 0 30px '+m.c+'66"></span><div><h2 class="text-4xl gt">'+k+'</h2><p class="muted">'+m.t+'</p></div></div><div class="grid sm:grid-cols-2 gap-4 mt-6">'+rows.map(function(r){return '<div class="stat"><h3 class="text-2xl">'+r[0]+'</h3><p class="muted mt-1">'+r[1]+'</p></div>'}).join('')+'</div></div>'}
show(cur);</script></body></html>
