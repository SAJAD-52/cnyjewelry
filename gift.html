<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewelry gift finder | koojewelry</title><meta name="description" content="Answer four quick questions and get three jewelry gift ideas matched to her style and your budget."><meta name="theme-color" content="#020617"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💍%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="style.css"></head><body><a class="skip" href="#main">Skip to content</a><div id="nav"></div><main id="main" class="mx-auto max-w-6xl px-5 pb-24 pt-10"><div class="max-w-2xl mb-10"><h1 class="text-5xl md:text-6xl gt">Find the right gift</h1><p class="muted text-lg mt-4">Four quick questions. Save any idea to your wishlist.</p></div><div class="glass p-6 md:p-10 max-w-3xl"><div id="q"></div></div><div id="r" class="mt-8"></div></main><div id="foot"></div><script src="layout.js"></script><script>var Q=[['What is the occasion?',['Birthday','Anniversary','Just because','Engagement or wedding']],['How would you describe her style?',['Minimal','Classic','Bold','Vintage']],['What is your budget?',['Under $50','$50 to $150','$150 to $500','Over $500']],['Which metal does she wear?',['Yellow gold','Silver','Rose gold','Not sure']]];

var a=[],s=0;

if(s>=Q.length)return done();

el.querySelectorAll('[data-o]').forEach(function(b){b.onclick=function(){a[s]=b.dataset.o;s++;step()}});

function done(){document.getElementById('q').innerHTML='<h2 class="text-4xl gt">Your three ideas are ready</h2><p class="muted mt-2">'+N[a[0]]+'</p><button id="rs" class="btn btn-ghost mt-5">Start over</button>';
document.getElementById('rs').onclick=function(){a=[];s=0;document.getElementById('r').innerHTML='';step()};
var t=Q[2][1].indexOf(a[2]),list=I[a[1]],pick=[t-1,t,t+1].filter(function(i){return i>=0&&i<4}),m=a[3]==='Not sure'?'':' in '+a[3].toLowerCase();
